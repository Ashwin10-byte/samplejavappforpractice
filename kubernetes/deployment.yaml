apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-java-app
  labels:
    app: sample-java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-java-app
  template:
    metadata:
      labels:
        app: sample-java-app
    spec:
      containers:
      - name: sample-java-app
        image: ashwinmendon/samplejavappforpractice:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-java-app-service
spec:
  type: NodePort
  selector:
    app: sample-java-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
